<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Constancia - Python</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #2b2b40;
            max-width: 420px;
            width: 90%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            text-align: center;
            border-top: 5px solid #FFD43B; /* Amarillo clásico de Python */
        }
        .logo {
            max-width: 90px;
            height: auto;
            margin-bottom: 15px;
            border-radius: 50%;
        }
        h2 {
            color: #306998; /* Azul clásico de Python */
            margin-bottom: 5px;
            font-size: 22px;
        }
        .instructor {
            font-size: 14px;
            color: #b0b0c3;
            margin-bottom: 20px;
            border-bottom: 1px solid #3f3f5f;
            padding-bottom: 15px;
        }
        .instructor strong {
            color: #ffffff;
        }
        .badge-role {
            color: #FFD43B;
            font-weight: 600;
        }
        .valido { color: #4ade80; font-size: 18px; font-weight: bold; }
        .invalido { color: #f87171; font-size: 18px; font-weight: bold; }
        
        .info-box {
            background: #1e1e2f;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
            font-size: 14px;
        }
        .info-box p {
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Espacio para tu logo (busca un archivo llamado logo.png en tu carpeta) -->
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        
        <h2>Verificación de Constancia</h2>
        <div class="instructor">
            Instructor: <strong>Carlos Antonio Torres</strong><br>
            <span class="badge-role">Data Engineer</span>
        </div>

        <div id="resultado">Cargando verificación...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const alumnoId = urlParams.get('id');
        const contenedor = document.getElementById('resultado');

        if (!alumnoId) {
            contenedor.innerHTML = "<p class='invalido'>❌ No se indicó un ID de constancia.</p>";
        } else {
            fetch('alumnos.json')
                .then(response => response.json())
                .then(data => {
                    const alumno = data.alumnos.find(a => a.id === alumnoId);
                    if (alumno) {
                        contenedor.innerHTML = `
                            <p class='valido'>¡Constancia Válida! ✅</p>
                            <div class="info-box">
                                <p><strong>Alumno:</strong> ${alumno.nombre}</p>
                                <p><strong>Curso:</strong> ${data.curso}</p>
                                <p><strong>Estado:</strong> ${alumno.estado}</p>
                                <p><strong>Fecha:</strong> ${alumno.fecha}</p>
                            </div>
                        `;
                    } else {
                        contenedor.innerHTML = "<p class='invalido'>❌ Constancia no encontrada o inválida.</p>";
                    }
                })
                .catch(() => {
                    contenedor.innerHTML = "<p class='invalido'>Error al verificar la constancia.</p>";
                });
        }
    </script>
</body>
</html>
